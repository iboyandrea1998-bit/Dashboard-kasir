<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Kasir Alfamart</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-red-600 p-4 text-white font-bold text-lg shadow-md flex justify-between items-center">
        <span>🏪 POS Dashboard - Alfamart Cipageran</span>
        <span class="text-xs bg-red-800 px-2 py-1 rounded">Live</span>
    </nav>

    <div class="max-w-md mx-auto p-4 mt-4">
        <h2 class="text-xl font-bold text-gray-800 mb-4">5 Transaksi Terbaru</h2>
        
        <!-- Wadah Data Tabel -->
        <div id="loading" class="text-center text-gray-500 py-4">Memuat data transaksi...</div>
        <div id="container-transaksi" class="space-y-3 hidden"></div>
    </div>

    <script>
        async function fetchSales() {
            try {
                const response = await fetch('/api/penjualan');
                const result = await response.json();
                
                if (result.status === "sukses") {
                    document.getElementById('loading').classList.add('hidden');
                    const container = document.getElementById('container-transaksi');
                    container.classList.remove('hidden');
                    container.innerHTML = '';

                    result.data_terbaru.forEach(item => {
                        const card = `
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-xs font-mono text-gray-400">${item.no_faktur}</span>
                                    <span class="text-xs text-gray-500">${item.jam_transaksi}</span>
                                </div>
                                <div class="text-lg font-bold text-green-600">${item.total_belanja}</div>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                }
            } catch (error) {
                document.getElementById('loading').innerText = "Gagal memuat data.";
            }
        }
        fetchSales();
    </script>
</body>
</html>
